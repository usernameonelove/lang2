<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Языки" />
  <title>Языки — учебник</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn back-btn is-hidden" id="backBtn" aria-label="Назад">←</button>
      <div class="topbar-title-wrap">
        <div class="eyebrow">LANGUAGE STUDY</div>
        <h1 id="pageTitle"></h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Настройки">⚙</button>
    </header>

    <main id="app" class="main-content"></main>

    <div class="toast" id="toast"></div>
  </div>

  <dialog class="modal" id="modal">
    <form method="dialog" id="modalForm" class="modal-card">
      <div class="modal-head">
        <div>
          <div class="eyebrow" id="modalEyebrow">NEW</div>
          <h2 id="modalTitle">Добавить</h2>
        </div>
        <button type="button" class="icon-btn" id="modalClose" aria-label="Закрыть">×</button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="modalCancel">Отмена</button>
        <button type="submit" class="btn primary" id="modalSubmit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
